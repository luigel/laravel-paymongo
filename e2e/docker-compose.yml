name: laravel-paymongo-e2e

services:
  # The sandbox Laravel app. The repository root is mounted at /app, so the
  # package is consumed through a composer `path` repository at ../.. which
  # resolves identically on the host and inside the container.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/e2e/app
    command: php artisan serve --host=0.0.0.0 --port=8000
    env_file:
      - path: .env
        required: false
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_ALLOW_SUPERUSER: '1'
      PAYMONGO_E2E: '1'
    volumes:
      - ../:/app
      - composer-cache:/tmp/composer
    expose:
      - '8000'
    ports:
      - '${APP_PORT:-8000}:8000'

  # Zero-config public tunnel. Prints a fresh https://*.trycloudflare.com URL
  # to its log on every start; bin/setup parses it from there.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ['cloudflared']
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      - app
    restart: unless-stopped

  # Alternative tunnel. Needs NGROK_AUTHTOKEN; with NGROK_DOMAIN set, bin/setup
  # exports NGROK_EXTRA_ARGS=--url=<domain> so the URL is stable across runs.
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ['ngrok']
    command: http app:8000 ${NGROK_EXTRA_ARGS:-}
    env_file:
      - path: .env
        required: false
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - app
    expose:
      - '4040'
    ports:
      - '${NGROK_WEB_PORT:-4040}:4040'
    restart: unless-stopped

volumes:
  composer-cache:
